#
# Shared build and pack template used by CI and PR pipelines.
# CI sets MustPublish: true for signed Official builds.
# PR sets MustPublish: false for Unofficial validation builds.
#
# EXPERIMENT: This version replaces the real build jobs with lightweight
# Setup/Verify jobs to test ADO variable passing and cross-stage conditions.
# Revert to the previous commit to restore the real pipeline.
#

parameters:
- name: MustPublish
  type: boolean
  default: false

- name: isReleaseBuild
  displayName: 'Treat as Release build'
  type: string
  default: auto
  values:
    - auto
    - 'true'
    - 'false'

- name: AgentPool
  type: object
  default:
    Medium:
      name: rnw-pool-4-microsoft
      demands: ImageOverride -equals rnw-img-vs2022-node22
    Large:
      name: rnw-pool-8-microsoft
      demands: ImageOverride -equals rnw-img-vs2022-node22

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  ${{ if eq(parameters.MustPublish, true) }}:
    template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  ${{ else }}:
    template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool: ${{ parameters.AgentPool.Medium }}
    ${{ if eq(parameters.MustPublish, false) }}:
      settings:
        skipBuildTagsForGitHubPullRequests: true
    featureFlags:
      autoEnablePREfastWithNewRuleset: false
    sdl:
      credscan:
          suppressionsFile: $(Build.SourcesDirectory)\.ado\config\CredScanSuppressions.json
      spotBugs:
          enabled: false
      prefast:
          enabled: false
    stages:
    - stage: RNWPublish
      jobs:
        # ============================================================
        # EXPERIMENT: Setup job - detect build scenario
        # ============================================================
        - job: Setup
          displayName: Detect build scenario
          pool: ${{ parameters.AgentPool.Medium }}
          steps:
          - checkout: none

          - script: |
              echo == Build Variables ==
              echo Build.Reason:                    $(Build.Reason)
              echo Build.SourceBranch:              $(Build.SourceBranch)
              echo Build.SourceBranchName:          $(Build.SourceBranchName)
              echo Build.SourceVersion:             $(Build.SourceVersion)
              echo Build.SourceVersionMessage:      $(Build.SourceVersionMessage)
              echo System.PullRequest.SourceBranch: $(System.PullRequest.SourceBranch)
              echo System.PullRequest.TargetBranch: $(System.PullRequest.TargetBranch)
            displayName: Log all pipeline variables

          - pwsh: |
              $param = '${{ parameters.isReleaseBuild }}'
              $buildReason = '$(Build.Reason)'
              $sourceMessage = '$(Build.SourceVersionMessage)'
              $prSourceBranch = '$(System.PullRequest.SourceBranch)'

              Write-Host "param=$param"
              Write-Host "buildReason=$buildReason"
              Write-Host "sourceMessage=$sourceMessage"
              Write-Host "prSourceBranch=$prSourceBranch"

              if ($param -eq 'true') {
                $isRelease = $true
                Write-Host "Release build forced by parameter"
              }
              elseif ($param -eq 'false') {
                $isRelease = $false
                Write-Host "Developer build forced by parameter"
              }
              else {
                if ($buildReason -eq 'PullRequest') {
                  $isRelease = $prSourceBranch.StartsWith('prepare-release/')
                  Write-Host "PR source branch: $prSourceBranch -> isRelease=$isRelease"
                }
                else {
                  $firstLine = ($sourceMessage -split "`n")[0].Trim()
                  $isRelease = $firstLine.StartsWith("RELEASE:")
                  Write-Host "Commit message first line: $firstLine -> isRelease=$isRelease"
                }
              }

              Write-Host "RESULT: isReleaseBuild=$isRelease"
              Write-Host "##vso[task.setvariable variable=isReleaseBuild;isOutput=true]$isRelease"
              Write-Host "##vso[task.setvariable variable=isReleaseBuild]$isRelease"
            name: detectScenario
            displayName: Detect build scenario

          # Verify same-job step condition using variables['stepName.varName']
          - script: echo "SAME-JOB CHECK (True branch) - isReleaseBuild=True"
            displayName: "SAME-JOB: isReleaseBuild=True"
            condition: eq(variables['detectScenario.isReleaseBuild'], 'True')

          - script: echo "SAME-JOB CHECK (False branch) - isReleaseBuild=False"
            displayName: "SAME-JOB: isReleaseBuild=False"
            condition: eq(variables['detectScenario.isReleaseBuild'], 'False')

        # ============================================================
        # EXPERIMENT: Verify same-stage cross-job variable access
        # ============================================================
        - job: VerifySameStage
          displayName: Verify same-stage cross-job variable access
          dependsOn: Setup
          pool: ${{ parameters.AgentPool.Medium }}
          variables:
            setupIsRelease: $[ dependencies.Setup.outputs['detectScenario.isReleaseBuild'] ]
          steps:
          - checkout: none
          - script: |
              echo === Same-stage cross-job variable access ===
              echo Via variable macro: $(setupIsRelease)
            displayName: Read output from Setup (same stage)

    # ============================================================
    # EXPERIMENT: Cross-stage condition - dev build
    # ============================================================
    - stage: DevBuildStage
      displayName: Dev build stage (runs when isReleaseBuild=False)
      dependsOn: RNWPublish
      condition: eq(dependencies.RNWPublish.outputs['Setup.detectScenario.isReleaseBuild'], 'False')
      jobs:
        - job: ShouldRunForDevBuilds
          pool: ${{ parameters.AgentPool.Medium }}
          steps:
            - checkout: none
            - script: echo "This stage ran because isReleaseBuild=False (dev build)"
              displayName: Confirm dev build stage ran

    # ============================================================
    # EXPERIMENT: Cross-stage condition - release build
    # ============================================================
    - stage: ReleaseBuildStage
      displayName: Release build stage (runs when isReleaseBuild=True)
      dependsOn: RNWPublish
      condition: eq(dependencies.RNWPublish.outputs['Setup.detectScenario.isReleaseBuild'], 'True')
      jobs:
        - job: ShouldRunForReleaseBuilds
          pool: ${{ parameters.AgentPool.Medium }}
          steps:
            - checkout: none
            - script: echo "This stage ran because isReleaseBuild=True (release build)"
              displayName: Confirm release build stage ran
